name: Construieste APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Seteaza Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Instaleaza dependentele si Buildozer
      run: |
        sudo apt-get update
        sudo apt-get install -y \
            git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
        pip install --upgrade pip
        pip install --user Cython==0.29.36 buildozer

    - name: Construieste APK cu Buildozer
      run: |
        export PATH=$PATH:~/.local/bin
        buildozer -v android debug

    - name: Salveaza APK-ul ca fisier descarcabil
      uses: actions/upload-artifact@v4
      with:
        name: pachet-apk
        path: bin/*.apk
